name: Deploy Doodhwala PWA and Expo web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js for Expo web export
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Build Expo web app into a separate Pages subfolder
        working-directory: mobile-app
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
          npx expo export --platform web --output-dir ../mobile-app-web
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
