name: Generate Doodhwala app icons
on:
  push:
    branches: [main]
    paths:
      - "assets/milk-delivery-rider.gif.gif"
      - ".github/workflows/generate-app-icon.yml"
      - "manifest.webmanifest"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - name: Create PNG icons from the exact milk rider GIF
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open("assets/milk-delivery-rider.gif.gif").convert("RGBA")
          # Keep the supplied rider artwork intact; place it on the brand-orange tile.
          canvas = Image.new("RGBA", (512, 512), (252, 128, 25, 255))
          src.thumbnail((480, 420), Image.Resampling.LANCZOS)
          canvas.alpha_composite(src, ((512 - src.width) // 2, (512 - src.height) // 2))
          canvas.convert("RGB").save("assets/doodhwala-app-icon-512.png", optimize=True)
          canvas.resize((192, 192), Image.Resampling.LANCZOS).convert("RGB").save("assets/doodhwala-app-icon-192.png", optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/doodhwala-app-icon-192.png assets/doodhwala-app-icon-512.png
          git commit -m "Generate PNG app icons from supplied milk rider GIF" || exit 0
          git push
